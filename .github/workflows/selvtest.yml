name: Selvtest

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Selvtest (streng - ingen ❌ og ingen ⏳)
        run: python scripts/selftest.py --strict
      - name: Enhetstester
        run: python -m unittest discover -s tests -t .
